services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: bennu
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin}
      POSTGRES_DB: trabajadores
    ports:
      - "5433:5432"
    volumes:
      - datosTrabajadores:/var/lib/postgresql/data
      - ./tablasBennu/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bennu -d trabajadores"]
      interval: 5s
      timeout: 5s
      retries: 10
  aplicacion:
    build:
      context: ./tablasBennu
      dockerfile: Dockerfile
    environment:
      DB_URL: jdbc:postgresql://db:5432/trabajadores
      DB_USER: bennu
      DB_PASSWORD: ${DB_PASSWORD:-admin}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
volumes:
  datosTrabajadores:
    external: true
    name: datos_trabajadores
